name: Update GitHub Star Counts

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:17 UTC (offset from the Scholar crawler at 08:00 UTC)
    - cron: '17 7 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stars.py

      - name: Publish to github-star-stats branch
        run: |
          set -euo pipefail
          if [ ! -f assets/star_counts.json ]; then
            echo "assets/star_counts.json missing; nothing to publish" >&2
            exit 1
          fi
          mkdir -p _publish
          cp assets/star_counts.json _publish/star_counts.json
          cd _publish
          git init -b github-star-stats
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add star_counts.json
          git commit -m "Refresh star counts"
          remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" HEAD:github-star-stats --force
