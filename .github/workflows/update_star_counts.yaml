name: Update Star Counts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Seed previous values from star-stats branch
        run: |
          mkdir -p results
          if git ls-remote --exit-code --heads origin star-stats >/dev/null 2>&1; then
            git fetch origin star-stats --depth=1
            git show origin/star-stats:star_counts.json > results/star_counts.json || true
          fi

      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stars.py

      - name: Push JSON to star-stats branch
        run: |
          cd results
          git init -q
          git checkout -b star-stats
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add star_counts.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh star counts"
          remote="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f "$remote" HEAD:star-stats
